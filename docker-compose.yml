## ==================================================================
## DOCKER COMPOSE - Nutra (API + Frontend + DB)
## ==================================================================
## Domínio nutricional completo:
##   - nutra-api (.NET 9)
##   - nutra-frontend (Next.js 16)
##   - db-nutra (PostgreSQL 16)
##
## Diretório no servidor: /opt/nutra/
## Pré-requisito: docker network create app-network
## Dependência externa: web-auth (stack auth) deve estar rodando
## ==================================================================

services:
  # ================================================================
  # NUTRA API - API Nutricional (.NET 9)
  # ================================================================
  nutra-api:
    image: ghcr.io/${GITHUB_OWNER:-marcobailer}/nutra-api:${NUTRA_TAG:-latest}
    container_name: nutra-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080
      # Ativa o app.UsePathBase("/nutra-api") do Program.cs. O nginx repassa
      # /nutra-api/... SEM rewrite, então sem esta flag toda rota dá 404.
      - DOCKER_CONTAINER=true
      - ConnectionStrings__DefaultConnection=Host=db-nutra;Port=5432;Database=${NUTRA_DB_NAME:-nutra_db};Username=${NUTRA_DB_USER:-nutra_user};Password=${NUTRA_DB_PASSWORD:?NUTRA_DB_PASSWORD required}
      # COM barra final: o Program.cs usa Authority também como ValidIssuer, e o
      # OpenIddict emite iss="https://host/" (com barra). Sem a barra → 401 em tudo.
      - Authentication__Authority=${APP_BASE_URL:-http://localhost}/
      # Obrigatório (Program.cs lança InvalidOperationException se faltar).
      # Deve casar com o claim "aud", que vem dos Resources do scope no shark-lock.
      - Authentication__Audience=${NUTRA_API_AUDIENCE:-projeto-nutra-api}
      # Origem CORS — o ASP.NET exige origem SEM barra final para casar.
      - AppSettings__BaseUrlFront=${APP_BASE_URL:-http://localhost}
    volumes:
      - nutra-data-protection:/app/keys
    depends_on:
      db-nutra:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - app-network
      - nutra-db-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ================================================================
  # NUTRA FRONTEND - App Nutricional (Next.js 16)
  # ================================================================
  nutra-frontend:
    image: ghcr.io/${GITHUB_OWNER:-marcobailer}/nutra-frontend:${NUTRA_FRONTEND_TAG:-latest}
    container_name: nutra-frontend
    restart: unless-stopped
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      # ── Auth.js v5 (runtime, server-side) ────────────────────────
      # AUTH_SECRET, não NEXTAUTH_SECRET: o proxy BFF chama
      # getToken({ secret: process.env.AUTH_SECRET }) explicitamente.
      - AUTH_SECRET=${NUTRA_FRONTEND_AUTH_SECRET:?NUTRA_FRONTEND_AUTH_SECRET required}
      # Precisa ser https:// — o BFF deriva secureCookie desta string. Em http
      # ele procuraria o cookie sem o prefixo __Secure- e daria 401 em toda chamada.
      - AUTH_URL=${APP_BASE_URL:-http://localhost}/nutra-app/api/auth
      # ── OIDC Provider (runtime, server-side) ─────────────────────
      # SEM barra final: o código monta ${OIDC_ISSUER}/.well-known/openid-configuration.
      - OIDC_ISSUER=${APP_BASE_URL:-http://localhost}
      - OIDC_CLIENT_ID=${NUTRA_FRONTEND_OIDC_CLIENT_ID:-nutra-http}
      - OIDC_CLIENT_SECRET=${NUTRA_FRONTEND_OIDC_CLIENT_SECRET:?NUTRA_FRONTEND_OIDC_CLIENT_SECRET required}
      # ── API interna (rede Docker; inclui o pathbase /nutra-api) ──
      - NUTRA_API_URL=http://nutra-api:8080/nutra-api
    depends_on:
      nutra-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/nutra-app"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

  # ================================================================
  # BANCO DE DADOS - PostgreSQL (Nutra)
  # ================================================================
  # Fica só na nutra-db-network (internal: true): sem rota para fora e sem
  # publicação de porta no host — em rede internal o Docker ignora "ports:".
  # Acesso local pontual (DBeaver/psql):
  #   docker exec -it db-nutra psql -U nutra_user -d nutra_db
  #   docker run --rm -d --network nutra_nutra-db-network -p 127.0.0.1:5433:5433 \
  #     alpine/socat tcp-listen:5433,fork,reuseaddr tcp-connect:db-nutra:5432
  db-nutra:
    image: postgres:16-alpine
    container_name: db-nutra
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NUTRA_DB_NAME:-nutra_db}
      POSTGRES_USER: ${NUTRA_DB_USER:-nutra_user}
      POSTGRES_PASSWORD: ${NUTRA_DB_PASSWORD:?NUTRA_DB_PASSWORD required}
    volumes:
      - nutra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NUTRA_DB_USER:-nutra_user} -d ${NUTRA_DB_NAME:-nutra_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nutra-db-network
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  nutra-postgres-data:
    driver: local
  nutra-data-protection:
    driver: local

networks:
  app-network:
    external: true
  nutra-db-network:
    driver: bridge
    internal: true
