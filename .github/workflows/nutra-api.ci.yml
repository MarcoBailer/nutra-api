## ==================================================================
## CI/CD - Nutra API
## ==================================================================
## Build → Push GHCR → Deploy via SSH (CD distribuído)
## Lead repo: gera .env para o compose nutra (/opt/nutra/)
## ==================================================================

name: CI/CD - Nutra API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nutra-api

jobs:
  # ── CI: Build & Push ────────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── CD: Deploy ──────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-nutra
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd /opt/nutra

            # Rede compartilhada com o proxy (idempotente)
            docker network inspect app-network >/dev/null 2>&1 || docker network create app-network

            # Gera .env (lead repo — gera para todo o compose nutra)
            # APP_BASE_URL deve vir SEM barra no final; o compose deriva as variantes.
            cat > .env << 'ENVEOF'
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            ASPNETCORE_ENVIRONMENT=Production
            GITHUB_OWNER=${{ secrets.GHCR_USER }}
            NUTRA_TAG=latest
            NUTRA_FRONTEND_TAG=latest
            NUTRA_DB_NAME=${{ secrets.NUTRA_DB_NAME }}
            NUTRA_DB_USER=${{ secrets.NUTRA_DB_USER }}
            NUTRA_DB_PASSWORD=${{ secrets.NUTRA_DB_PASSWORD }}
            NUTRA_API_AUDIENCE=${{ secrets.NUTRA_API_AUDIENCE }}
            NUTRA_FRONTEND_AUTH_SECRET=${{ secrets.NUTRA_FRONTEND_AUTH_SECRET }}
            NUTRA_FRONTEND_OIDC_CLIENT_ID=${{ secrets.NUTRA_FRONTEND_OIDC_CLIENT_ID }}
            NUTRA_FRONTEND_OIDC_CLIENT_SECRET=${{ secrets.NUTRA_FRONTEND_OIDC_CLIENT_SECRET }}
            ENVEOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            docker compose pull nutra-api
            docker compose up -d db-nutra nutra-api

            sleep 15
            docker compose ps
            echo "✅ nutra-api deployed!"
